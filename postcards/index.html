          <h2>自分宛て</h2>
        </div>

        <div class="postcard-list">
          <article class="postcard-entry">
            <div class="postcard-text">
              <span class="entry-label">card 001</span>
              <h3>New York, NY</h3>
              <dl class="postcard-meta">
                <div>
                  <dt>書いた日</dt>
                  <dd><time datetime="2026-05-16">2026.05.16</time></dd>
                </div>
                <div>
                  <dt>処理日時</dt>

                </div>
                <div>
                  <dt>処理場所</dt>
                  <dd>New York, NY / NY 100</dd>
                </div>
                <div>
                  <dt>消印表示</dt>
                  <dd>PM 6 L</dd>
                </div>
              </dl>
            </div>
            <figure class="postcard-photo">
              <img src="../images/postcards/card-001-back.jpg" alt="花柄のハガキ背面とNew York, NY 100の消印" loading="lazy">
            </figure>
          </article>
