<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Beat Tape Volume 2 - parklifeduck</title>
  <meta name="description" content="Beat Tape Volume 2。">
  <link rel="stylesheet" href="../../style.css">
</head>
<body>
  <main class="page">
    <section class="subpage" aria-label="Beat Tape Volume 2">
      <a class="back-link" href="../">← ビート</a>
      <h1 class="page-title">Beat Tape Volume 2</h1>
      <p class="page-note">次に残しておく音のまとまり。</p>

      <div class="album-player" data-player>
        <div class="album-now">
          <div class="album-current-wrap">
            <span class="entry-label">now playing</span>
            <p class="album-current" data-current-title>01 / find my wings again</p>
          </div>
          <audio controls preload="none" data-audio src="../../audio/beat-tape-volume-2/01-find-my-wings-again.mp3"></audio>
        </div>

        <ol class="album-track-list">
          <li class="album-track is-active" data-src="../../audio/beat-tape-volume-2/01-find-my-wings-again.mp3" data-title="find my wings again">
            <button class="track-play" type="button" aria-label="find my wings againを再生">▶</button>
            <span class="track-number">01</span>
            <span class="track-title">find my wings again</span>
          </li>
          <li class="album-track" data-src="../../audio/beat-tape-volume-2/02-misty-wave.mp3" data-title="misty wave">
            <button class="track-play" type="button" aria-label="misty waveを再生">▶</button>
            <span class="track-number">02</span>
            <span class="track-title">misty wave</span>
          </li>
          <li class="album-track" data-src="../../audio/beat-tape-volume-2/03-joey.mp3" data-title="joey">
            <button class="track-play" type="button" aria-label="joeyを再生">▶</button>
            <span class="track-number">03</span>
            <span class="track-title">joey</span>
          </li>
          <li class="album-track" data-src="../../audio/beat-tape-volume-2/04-trip-to-san-francisco.mp3" data-title="trip to San Francisco">
            <button class="track-play" type="button" aria-label="trip to San Franciscoを再生">▶</button>
            <span class="track-number">04</span>
            <span class="track-title">trip to San Francisco</span>
          </li>
        </ol>
      </div>
    </section>
  </main>
  <script src="../player.js"></script>
</body>
</html>
