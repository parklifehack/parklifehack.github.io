<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>parklifehack</title>
  <meta name="description" content="Bread, photographs, postcards, beats, and short notes.">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <section class="intro" aria-label="Home">
      <p class="label">parklifehack</p>

      <figure class="photo-frame">
        <img class="main-photo" src="images/main.jpg" alt="Jersey City Main Post Officeの古い案内板">
      </figure>

      <div class="text">
        <p><a href="#bread">パン</a>を焼く。</p>
        <p><a href="#photos">写真</a>を残す。</p>
        <p>短い<a href="#words">言葉</a>だけ置いておく。</p>
        <p><a href="#postcards">ハガキ</a>でも書く。</p>
        <p><a href="#beats">ビート</a>を作る。</p>
      </div>
    </section>

    <section class="topics" aria-label="Topics">
      <article id="bread" class="topic">
        <p class="topic-label">bread</p>
        <h2>パン</h2>
        <p>焼いたもの、配合、失敗したこと。</p>
      </article>

      <article id="photos" class="topic">
        <p class="topic-label">photos</p>
        <h2>写真</h2>
        <p>街で見た文字、壁、光、残しておきたいもの。</p>
      </article>

      <article id="words" class="topic">
        <p class="topic-label">words</p>
        <h2>言葉</h2>
        <p>長く書くほどではない、短い記録。</p>
      </article>

      <article id="postcards" class="topic">
        <p class="topic-label">postcards</p>
        <h2>ハガキ</h2>
        <p>送ったもの、届いたもの、書く前の余白。</p>
      </article>

      <article id="beats" class="topic">
        <p class="topic-label">beats</p>
        <h2>ビート</h2>
        <p>短いループ、サンプル、夜の音。</p>
      </article>
    </section>
  </main>
</body>
</html>
